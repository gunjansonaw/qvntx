# Local stack: React UI (nginx) on http://localhost:8080, API on http://localhost:8000
#   docker compose up --build
name: wind-desk

services:
  backend:
    build: ./backend
    environment:
      DATA_MODE: ${DATA_MODE:-live} # "snapshot" to run fully offline
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - elexon-cache:/app/.cache # last good live fetch survives restarts (fallback only)
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  elexon-cache:
